# Entorno aislado de pruebas (Partly - F1.1.A)
# Base de datos H2 exclusivamente en memoria (modo MySQL) con credenciales sinteticas.
spring.datasource.url=jdbc:h2:mem:partly_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=partly_test
spring.datasource.password=

# Esquema efimero en memoria por ejecucion de suite
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Proveedores externos desactivados en pruebas (complementado con mocks @Primary)
# Contiene el placeholder exacto esperado por la salvaguarda interna de GoogleAuthService (C4 / F11A-AUD-001)
google.client.id=YOUR_GOOGLE_CLIENT_ID_TEST_DISABLED
