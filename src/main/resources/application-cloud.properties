# NEXUS - Cloud deployment
spring.application.name=NEXUS

# Render
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${NEXUS_CLOUD_DB_URL}
spring.datasource.username=${NEXUS_CLOUD_DB_USERNAME}
spring.datasource.password=${NEXUS_CLOUD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Database migrations
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Session security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# External integrations
nexus.ai.groq.enabled=false
nexus.telegram.enabled=false
nexus.telegram.groups-enabled=false
nexus.demo.seed-enabled=false

# Error security
server.error.include-stacktrace=never
server.error.include-message=never
