# NEXUS - Cloud deployment
spring.application.name=NEXUS

# Render
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${NEXUS_CLOUD_DB_URL}
spring.datasource.username=${NEXUS_CLOUD_DB_USERNAME}
spring.datasource.password=${NEXUS_CLOUD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Database migrations
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Session security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# External integrations (deshabilitadas por defecto si no hay credenciales en Render)
nexus.ai.groq.enabled=${GROQ_ENABLED:false}
nexus.ai.groq.api-key=${GROQ_API_KEY:}
nexus.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

nexus.telegram.enabled=${TELEGRAM_ENABLED:false}
nexus.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
nexus.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
nexus.telegram.groups-enabled=${TELEGRAM_GROUPS_ENABLED:false}
nexus.telegram.poll-timeout=${TELEGRAM_POLL_TIMEOUT:25}
nexus.telegram.max-concurrent-updates=${TELEGRAM_MAX_CONCURRENT_UPDATES:2}

google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
nexus.demo.seed-enabled=false

# Error security
server.error.include-stacktrace=never
server.error.include-message=never
