<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
    <style>
        /* MODO CLARO: logo a color */
        .a { fill: #EC6E5E; }   /* mitad coral */
        .b { fill: #1C5C50; }   /* mitad verde */
        .c { fill: #FFFFFF; }   /* círculo del centro */
        .p { fill: #1C5C50; }   /* letra P */

        /* MODO OSCURO: logo monocromático */
        @media (prefers-color-scheme: dark) {
        .a { fill: #9A9C9E; }
        .b { fill: #E6E7E8; }
        .c { fill: #151A1D; }
        .p { fill: #FFFFFF; }
        }
    </style>
    <circle class="b" cx="40" cy="40" r="40"/>
    <path class="a" d="M70.7 14.4 A40 40 0 0 0 9.3 65.6 Z"/>
    <circle class="c" cx="40" cy="40" r="14.5"/>
    <text class="p" x="40" y="46.5" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">P</text>
</svg>