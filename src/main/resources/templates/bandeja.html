<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/nexus-layout :: head('Asistente NEXUS · Bandeja Inteligente')}"></head>
<body>
<div th:replace="~{fragments/nexus-layout :: topnav('asistente')}"></div>
<div class="app-container">
    <header class="top-bar">
        <a th:href="@{/inicio}" class="btn-back" aria-label="Volver al inicio">←</a>
        <h1 class="top-bar-title">Asistente NEXUS</h1>
        <span style="width: 38px;"></span>
    </header>

    <main class="page-content">
        <div th:if="${errorBandeja}" class="alert-error" style="margin-bottom: 16px;" th:text="${errorBandeja}">
            Error
        </div>

        <section class="section-block" style="margin-bottom: 20px;">
            <h2 class="section-block-title" style="font-size: 16px;">Interpretar gasto en lenguaje natural</h2>
            <p class="section-block-desc" style="font-size: 12px;"
               th:text="${groqDisponible ? 'Motor activo: Reglas locales + Groq Free (sujeto a confirmación humana).' : 'Motor activo: Reglas locales deterministas (Groq deshabilitado o sin cuota; operación 100% funcional).'}">
                Motor activo
            </p>

            <div th:if="${#lists.isEmpty(misGrupos)}" class="empty-state">
                <p>Únete o crea un grupo para usar el Asistente NEXUS.</p>
            </div>

            <form th:if="${!#lists.isEmpty(misGrupos)}"
                  th:action="@{/asistente/interpretar}"
                  method="post"
                  style="display: flex; flex-direction: column; gap: 12px;">
                <input type="hidden" name="idempotencyKey" th:value="${idempotencyKey}">

                <div>
                    <label for="grupoId" class="field-label">Grupo</label>
                    <select id="grupoId" name="grupoId" class="input-field" required>
                        <option th:each="mg : ${misGrupos}"
                                th:value="${mg.grupo.id}"
                                th:text="${mg.grupo.name}">
                            Grupo
                        </option>
                    </select>
                </div>

                <div>
                    <label for="texto" class="field-label">Instrucción</label>
                    <textarea id="texto"
                              name="texto"
                              class="input-field"
                              rows="3"
                              placeholder="Ej: Pagué 120 lucas del internet del apartamento. Divídelo entre todos"
                              required></textarea>
                </div>

                <button type="submit" class="btn-submit" style="height: 46px;">
                    Interpretar (crea borrador)
                </button>
            </form>
        </section>

        <section class="section-block">
            <h2 class="section-block-title" style="font-size: 16px;">Bandeja de borradores</h2>

            <div th:if="${#lists.isEmpty(borradores)}" class="empty-state">
                No tienes borradores registrados todavía.
            </div>

            <div th:each="b : ${borradores}" class="expense-card" style="margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong th:text="${b.grupo.name + ' · ' + b.concepto}">Grupo · Concepto</strong>
                    <span style="font-size: 12px; font-weight: 600;" th:text="${b.estado + ' (' + b.proveedorUtilizado + ')'}">ESTADO</span>
                </div>

                <p style="font-size: 12px; color: #5C6B66; margin: 0;" th:if="${b.mensajeOriginal}" th:text="${'Entrada: ' + b.mensajeOriginal}"></p>

                <div th:if="${b.estado.name() == 'PENDIENTE' or b.estado.name() == 'REQUIERE_ACLARACION'}">
                    <form th:action="@{/bandeja/{id}/confirmar(id=${b.id})}" method="post" style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="hidden" name="confirmIdempotencyKey" th:value="${'confirm-' + b.id}">

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div>
                                <label class="field-label">Concepto</label>
                                <input type="text" name="concepto" class="input-field" th:value="${b.concepto}" maxlength="100" required>
                            </div>
                            <div>
                                <label class="field-label">Monto (COP)</label>
                                <input type="text" name="montoCop" class="input-field"
                                       th:value="${b.montoCop != null ? b.montoCop.toPlainString() : ''}"
                                       placeholder="Ej: 120000" required>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div>
                                <label class="field-label">Fecha</label>
                                <input type="date" name="fecha" class="input-field" th:value="${b.fechaSugerida}" required>
                            </div>
                            <div>
                                <label class="field-label">Pagador</label>
                                <select name="pagadorId" class="input-field" required>
                                    <option th:each="m : ${miembrosPorGrupo[b.grupo.id]}"
                                            th:value="${m.usuario.id}"
                                            th:selected="${m.usuario.id == usuarioActualId}"
                                            th:text="${m.usuario.name}">
                                        Pagador
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="field-label">Participantes (división igualitaria)</label>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <label th:each="m : ${miembrosPorGrupo[b.grupo.id]}" style="font-size: 13px; display: inline-flex; align-items: center; gap: 4px;">
                                    <input type="checkbox" name="participantesIds" th:value="${m.usuario.id}" checked>
                                    <span th:text="${m.usuario.name}">Miembro</span>
                                </label>
                            </div>
                        </div>

                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button type="submit" class="btn-submit" style="height: 40px; flex: 1;">
                                Confirmar gasto
                            </button>
                        </div>
                    </form>

                    <form th:action="@{/bandeja/{id}/descartar(id=${b.id})}" method="post" style="margin-top: 6px;">
                        <button type="submit" class="btn-quick btn-quick-secondary" style="height: 36px; width: 100%;">
                            Descartar borrador
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
