<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${grupo.name}">Grupo</title>
</head>

<body>

<!-- ============================= -->
<!-- ENCABEZADO -->
<!-- ============================= -->

<header>

    <a href="/mis-grupos">
        ← Volver a mis grupos
    </a>
    <h1 th:text="${grupo.name}">
    </h1>

    <!-- Metadata del grupo: contexto secundario, no es lo primero que se lee -->
    <p>
        <small>
            Creado por
            <span th:text="${grupo.creador.name}">
            </span>
            el
            <span th:text="${grupo.fecha_creacion}">Fecha></span>
        </small>
    </p>
</header>

<!-- ============================= -->
<!-- TARJETA DE DEUDA -->
<!-- ============================= -->

<!-- PENDIENTE (HU10): el controlador todavía no calcula ni envía la deuda.
     Por ahora dejamos el mismo texto que ya tenía la vista ("Mi deuda: $0"),
     solo lo movemos a esta tarjeta para que quede en el lugar del Figma -->
<section>
    <p>Mi deuda</p>
    <p>$0</p>
</section>

<!-- ============================= -->
<!-- INTEGRANTES -->
<!-- ============================= -->

<section>

    <p>Integrantes:</p>

    <ul>

        <li th:each="miembro : ${miembros}">
            <span th:text="${miembro.usuario.name}">
            </span>
        </li>

    </ul>

</section>

<!-- ============================= -->
<!-- BOTÓN AGREGAR GASTO -->
<!-- ============================= -->

<a th:href="@{/grupo/{id}/gasto/nuevo(id=${grupo.id})}">
    <button type="button">+ Agregar gasto</button>
</a>

<!-- ============================= -->
<!-- HISTORIAL DE GASTOS -->
<!-- ============================= -->

<!-- PENDIENTE (HU09): el controlador todavía no envía la lista de gastos del grupo.
     Cuando GastoRepository.findByGrupoOrderByFechaDesc se conecte aquí,
     esto se reemplaza por un th:each igual que hicimos con los miembros -->
<section>

    <h2>Historial de gastos</h2>

    <p>
        Todavía no hay gastos registrados.
    </p>

</section>

</body>

</html>
