<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${grupo.name}">Grupo</title>
</head>

<body>

<!-- ============================= -->
<!-- ENCABEZADO DEL GRUPO -->
<!-- ============================= -->

<a href="/mis-grupos">
    ← Volver a mis grupos
</a>

<h1 th:text="${grupo.name}">
    Nombre del grupo
</h1>

<p>
    <strong>Creador:</strong>
    <span th:text="${grupo.creador.name}">
            Nombre del creador
        </span>
</p>

<p>
    <strong>Fecha de creación:</strong>
    <span th:text="${grupo.fecha_creacion}">
            Fecha
        </span>
</p>

<hr>


<!-- ============================= -->
<!-- MIEMBROS -->
<!-- ============================= -->

<h2>Miembros</h2>

<ul>

    <li th:each="miembro : ${miembros}">

        <strong th:text="${miembro.usuario.name}">
            Nombre
        </strong>

        <span th:text="' - Estado: ' + ${miembro.estado}">
                Estado
            </span>

    </li>

</ul>

<hr>


<!-- ============================= -->
<!-- GASTOS -->
<!-- ============================= -->

<h2>Gastos</h2>

<p>
    Todavía no hay gastos registrados.
</p>

<!-- Lo conectaremos cuando hagamos HU07 -->

<hr>


<!-- ============================= -->
<!-- RESUMEN -->
<!-- ============================= -->

<h2>Resumen</h2>

<p>
    <strong>Total gastado:</strong> $0
</p>

<p>
    <strong>Mi deuda:</strong> $0
</p>

<!-- Lo conectaremos cuando hagamos HU10 -->


<br>


</body>

</html>
