<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-icon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/partly.css}">
    <title>Iniciar sesión · Partly</title>
</head>
<body>
<main class="app auth-top">

    <div class="logo-lockup">
        <img class="logo-ring" th:src="@{/img/logo-icon.svg}" alt="">
        <span class="logo-word">partly</span>
    </div>
    <p class="logo-tagline">cuentas claras entre amigos</p>
    <h1 class="title">Bienvenido de nuevo</h1>
    <p class="subtitle">Inicia sesión para ver tus gastos</p>

    <form action="/login" method="post" style="margin-top:22px;">
        <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <p class="alert" th:if="${param.error}">Correo o contraseña incorrectos.</p>

        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <div class="divider"><span>o</span></div>

    <p class="auth-footer">
        ¿No tienes cuenta?
        <a href="/registro">Regístrate</a>
    </p>

</main>
</body>
</html>
