<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>

<body>

<h1>Iniciar sesión</h1>

<p th:if="${param.error}">
    Correo o contraseña incorrectos.
</p>

<form action="/login" method="post">

    <div>

        <label for="email">
            Correo electrónico:
        </label>

        <input
                type="email"
                id="email"
                name="email"
                required>

    </div>

    <br>

    <div>

        <label for="password">
            Contraseña:
        </label>

        <input
                type="password"
                id="password"
                name="password"
                required>

    </div>

    <br>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

</body>

</html>
