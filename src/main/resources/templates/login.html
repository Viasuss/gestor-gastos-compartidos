<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
</head>

<body>

<main>


    <h1>Bienvenido de nuevo</h1>
    <p>Inicia sesión para ver tus gastos</p>

    <!-- Mensaje de error (ya funciona con el controlador) -->
    <p th:if="${param.error}">
        Correo o contraseña incorrectos.
    </p>

    <form action="/login" method="post">

        <div>
            <label for="email">Correo electrónico</label>
            <br>
            <input
                    type="email"
                    id="email"
                    name="email"
                    required>
        </div>

        <br>

        <div>
            <label for="password">Contraseña</label>
            <br>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required>
        </div>

        <br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <!-- Separador "o" (las líneas a los lados se hacen con CSS) -->
    <div>
        <span>o</span>
    </div>

    <p>
        ¿No tienes cuenta?
        <a href="/registro">Regístrate</a>
    </p>

</main>

</body>

</html>
