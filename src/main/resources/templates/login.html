<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-icon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/partly.css}">
    <title>Iniciar sesión · Partly</title>
</head>
<body>
<div class="auth-wrapper">
    <main class="auth-card">

        <!-- Logo e Isotipo oficial de Partly -->
        <div class="auth-header">
            <div class="auth-logo-row">
                <img class="auth-logo-img" th:src="@{/img/logo-icon.svg}" alt="Partly Logo">
                <span class="auth-brand-name">partly</span>
            </div>
            <div>
                <h1 class="auth-title">Bienvenido de nuevo</h1>
                <p class="auth-subtitle">Inicia sesión para ver tus gastos</p>
            </div>
        </div>

        <!-- Mensajes de Estado -->
        <div class="alert-message" th:if="${param.error}">
            Correo o contraseña incorrectos. Intenta nuevamente.
        </div>
        <div class="alert-message success" th:if="${param.registrado}">
            ¡Cuenta creada exitosamente! Ya puedes iniciar sesión.
        </div>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    autocomplete="email"
                    placeholder="tucorreo@ejemplo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required>
            </div>

            <button type="submit" class="btn-submit">
                Iniciar sesión
            </button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">o continúa con</span>
            <div class="divider-line"></div>
        </div>

        <!-- Botón Continuar con Google -->
        <button type="button" class="btn-google-connect" onclick="alert('Para activar el inicio de sesión con Google se necesita configurar Client ID en Google Cloud Console. Revisa los requerimientos detallados.')" style="height: 50px; font-size: 14px;">
            <svg class="google-icon-svg" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continuar con Google</span>
        </button>

        <p class="auth-footer-text">
            ¿No tienes cuenta?
            <a th:href="@{/registro}">Regístrate</a>
        </p>

    </main>
</div>
</body>
</html>
