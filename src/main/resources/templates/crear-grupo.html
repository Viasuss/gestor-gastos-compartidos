<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Crear grupo</title>
</head>

<body>

<h1>Crear grupo</h1>

<form th:action="@{/grupo/crear}"
      th:object="${grupo}"
      method="post">

    <label for="name">Nombre del grupo:</label>

    <input
            type="text"
            id="name"
            th:field="*{name}"
            placeholder="Ej: Viaje al pueblo"
            required>

    <br><br>

    <button type="submit">
        Crear grupo
    </button>

</form>

<br>

<a href="/inicio">
    Volver al inicio
</a>

</body>

</html>
