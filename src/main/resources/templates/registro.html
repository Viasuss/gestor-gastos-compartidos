<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>

<body>

<h1>Crea tu cuenta</h1>
 <p> empieza a controlar tus gastos compartidos </p>


<form th:action="@{/registro}" th:object="${usuario}" method="post">

    <div>
        <label for="name">Nombre completo:</label>

        <input
                type="text"
                id="name"
                th:field="*{name}"
                required>
    </div>

    <br>

    <div>
        <label for="email">Correo electrónico:</label>

        <input
                type="email"
                id="email"
                th:field="*{email}"
                required>
    </div>

    <br>

    <div>
        <label for="password">Contraseña:</label>

        <input
                type="password"
                id="password"
                th:field="*{password}"
                required>
    </div>

    <br>

    <!-- Campo adicional para confirmar contraseña -->
    <div>
        <label for="confirmPassword">Confirmar contraseña:</label>

        <input
                type="password"
                id="confirmPassword"
                required>
        <span id="passwordError" style="color: red; display: none;"><br>Las contraseñas no coinciden</span>
    </div>

    <br>

    <button type="submit">
        Crear cuenta
    </button>
    <p> al crear tu cuenta aceptas los Terminos y la Politica de privacidad </p>
</form>

<div>
    <span>o</span>
</div>

<p>
    ¿ya tienes una cuenta?
    <a href="/login">Iniciar sesión</a>
</p>

<!-- Script de validación -->
<script>
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');

    function validarContraseñas() {
        if (confirmPassword.value === "") {
            confirmPassword.setCustomValidity("");
            passwordError.style.display = 'none';
            return;
        }

        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity("Las contraseñas no coinciden");
            passwordError.style.display = 'inline';
        } else {
            confirmPassword.setCustomValidity("");
            passwordError.style.display = 'none';
        }
    }

    password.addEventListener('change', validarContraseñas);
    confirmPassword.addEventListener('keyup', validarContraseñas);
</script>

</body>

</html>
