<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>

<body>

<h1>Crear una cuenta</h1>

<form th:action="@{/registro}" th:object="${usuario}" method="post">

    <div>
        <label for="name">Nombre:</label>

        <input
                type="text"
                id="name"
                th:field="*{name}"
                required>
    </div>

    <br>

    <div>
        <label for="email">Correo electrónico:</label>

        <input
                type="email"
                id="email"
                th:field="*{email}"
                required>
    </div>

    <br>

    <div>
        <label for="password">Contraseña:</label>

        <input
                type="password"
                id="password"
                th:field="*{password}"
                required>
    </div>

    <br>

    <button type="submit">
        Registrarse
    </button>

</form>

</body>

</html>
