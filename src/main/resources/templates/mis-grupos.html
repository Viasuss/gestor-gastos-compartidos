<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis grupos</title>
</head>

<body>

<h1>Mis grupos</h1>

<a href="/grupo/crear">
    <button type="button">Crear nuevo grupo</button>
</a>

<p>Grupos a los que perteneces:</p>

<div th:if="${#lists.isEmpty(miembros)}">

    <p>
        Todavía no perteneces a ningún grupo.
    </p>

</div>

<ul th:unless="${#lists.isEmpty(miembros)}">

    <li th:each="miembro : ${miembros}">

        <strong th:text="${miembro.grupo.name}">
            Nombre del grupo
        </strong>

        <span th:text="' - Estado: ' + ${miembro.estado}">
            Estado
        </span>

        <!-- NUEVO: balance real, solo tiene sentido mostrarlo si el
             usuario ya es MIEMBRO (no para invitaciones pendientes o
             rechazadas, que no tienen deudas calculadas en el mapa) -->
        <span th:if="${miembro.estado.name() == 'MIEMBRO'}">

            <span th:with="balance=${balancePorGrupo.get(miembro.grupo.id)}">

                <span th:if="${balance.signum() > 0}"
                      th:text="'+ $' + ${#numbers.formatDecimal(balance, 1, 'COMMA', 0, 'POINT')} + ' (te deben)'">
                </span>

                <span th:if="${balance.signum() < 0}"
                      th:text="'- $' + ${#numbers.formatDecimal(balance.abs(), 1, 'COMMA', 0, 'POINT')} + ' (debes)'">
                </span>

                <span th:if="${balance.signum() == 0}">
                    $0
                </span>

            </span>

        </span>

        <a th:if="${miembro.estado.name() == 'MIEMBRO'}"
           th:href="@{/grupo/{id}(id=${miembro.grupo.id})}">
            Ver grupo
        </a>

    </li>

</ul>

<br>

<a href="/inicio">
    Volver al inicio
</a>

</body>

</html>
