<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo-icon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/partly.css}">
    <title>Mis grupos · Partly</title>
</head>
<body>

<!-- ENCABEZADO -->
<header class="subpage-header">
    <a th:href="@{/inicio}" class="btn-back" aria-label="Volver">←</a>
    <h1 class="subpage-title">Mis grupos</h1>
</header>

<main class="page-content">

    <!-- BOTÓN CREAR NUEVO GRUPO -->
    <a th:href="@{/grupo/crear}" class="btn-submit" style="height: 50px; margin-top: 0;">
        +&nbsp;&nbsp;Crear nuevo grupo
    </a>

    <!-- CONTADOR DE GRUPOS ACTIVOS -->
    <p class="section-block-desc" style="font-weight: 500;"
       th:text="${gruposActivosCount} + ' grupos activos'">
        0 grupos activos
    </p>

    <!-- ESTADO VACÍO -->
    <div class="empty-state" th:if="${#lists.isEmpty(miembros) or gruposActivosCount == 0}">
        Todavía no perteneces a ningún grupo activo.
    </div>

    <!-- LISTA DE GRUPOS -->
    <div class="groups-list" th:unless="${#lists.isEmpty(miembros)}">
        <th:block th:each="miembro : ${miembros}">
            <a th:if="${miembro.estado.name() == 'MIEMBRO'}"
               th:href="@{/grupo/{id}(id=${miembro.grupo.id})}"
               class="group-card"
               style="padding: 16px;">

                <!-- Ícono / Emoji del grupo -->
                <div class="group-card-icon" style="width: 46px; height: 46px; font-size: 22px;">
                    👥
                </div>

                <!-- Información del grupo -->
                <div class="group-card-info">
                    <span class="group-card-name" th:text="${miembro.grupo.name}">
                        Nombre del grupo
                    </span>
                    <span class="group-card-members"
                          th:text="${detallesGrupo != null and detallesGrupo.get(miembro.grupo.id) != null ? detallesGrupo.get(miembro.grupo.id) : 'Integrantes del grupo'}">
                        Johan, Wilmer
                    </span>
                </div>

                <!-- Monto y Estado de Balance -->
                <div th:with="balance=${balancePorGrupo.get(miembro.grupo.id)}"
                     style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0;">

                    <!-- Te deben -->
                    <th:block th:if="${balance != null and balance.signum() > 0}">
                        <span class="group-card-amount pos"
                              style="color: #2D8B71;"
                              th:text="'$' + ${#numbers.formatDecimal(balance, 1, 'POINT', 0, 'COMMA')}">
                            $0
                        </span>
                        <span style="font-size: 11px; color: var(--text-muted);">te deben</span>
                    </th:block>

                    <!-- Debes -->
                    <th:block th:if="${balance != null and balance.signum() < 0}">
                        <span class="group-card-amount neg"
                              th:text="'$' + ${#numbers.formatDecimal(balance.abs(), 1, 'POINT', 0, 'COMMA')}">
                            $0
                        </span>
                        <span style="font-size: 11px; color: var(--text-muted);">debes</span>
                    </th:block>

                    <!-- A paz y salvo -->
                    <th:block th:if="${balance == null or balance.signum() == 0}">
                        <span class="group-card-amount" style="color: var(--text-muted);">$0</span>
                        <span style="font-size: 11px; color: var(--text-muted);">al día</span>
                    </th:block>

                </div>
            </a>
        </th:block>
    </div>

</main>

</body>
</html>
