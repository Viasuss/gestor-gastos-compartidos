<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar gasto</title>
</head>

<body>

<!-- Encabezado -->

<header>

    <a th:href="@{/grupo/{id}(id=${grupo.id})}">
        ←
    </a>

    <h1>Agregar gasto</h1>

</header>


<!-- Información del grupo -->

<section>

    <p>
        💰
        <strong th:text="${grupo.name}">
            Nombre del grupo
        </strong>
    </p>

</section>


<!-- Formulario -->

<main>

    <form
            th:action="@{/grupo/{id}/gasto(id=${grupo.id})}"
            method="post">


        <!-- DESCRIPCIÓN -->

        <section>

            <label for="descripcion">
                Descripción
            </label>

            <br>

            <input
                    type="text"
                    id="descripcion"
                    name="descripcion"
                    placeholder="Ej: Mercado, hospedaje..."
                    required>

        </section>


        <br>


        <!-- MONTO -->

        <section>

            <label for="monto">
                Monto
            </label>

            <br>

            <input
                    type="number"
                    id="monto"
                    name="monto"
                    placeholder="$ 0"
                    min="0"
                    step="0.01"
                    required>

        </section>


        <br>


        <!-- FECHA -->

        <section>

            <label for="fecha">
                Fecha
            </label>

            <br>

            <!-- Solo se muestra -->
            <!-- El backend será quien guarde la fecha real -->

            <input
                    type="text"
                    id="fecha"
                    th:value="${#temporals.format(T(java.time.LocalDate).now(), 'dd/MM/yyyy')}"
                    readonly>

        </section>


        <br>


        <!-- QUIÉNES PAGARON -->

        <section>

            <h2>
                ¿Quién pagó?
            </h2>

            <p>
                Puedes seleccionar una o varias personas.
            </p>


            <div th:each="miembro : ${miembros}">

                <label>

                    <input
                            type="checkbox"
                            name="pagadores"
                            th:value="${miembro.usuario.id}">

                    <span th:text="${miembro.usuario.name}">
                            Nombre del usuario
                        </span>

                </label>

                <br>

            </div>

        </section>


        <br>


        <!-- DIVIDIR ENTRE -->

        <section>

            <h2>
                Dividir entre
            </h2>

            <p>
                Selecciona las personas que participarán en el gasto.
            </p>


            <div th:each="miembro : ${miembros}">

                <label>

                    <input
                            type="checkbox"
                            name="participantes"
                            th:value="${miembro.usuario.id}">

                    <span th:text="${miembro.usuario.name}">
                            Nombre del usuario
                        </span>

                </label>

                <br>

            </div>

        </section>


        <br>


        <!-- INFORMACIÓN -->

        <section>

            <p>
                💵
                Se dividirá en partes iguales entre las
                personas seleccionadas.
            </p>

        </section>


        <br>


        <!-- BOTÓN -->

        <button type="submit">
            Guardar gasto
        </button>


    </form>

</main>

</body>

</html>
