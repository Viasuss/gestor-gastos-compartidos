<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar gasto</title>
</head>

<body>

<!-- Encabezado -->

<header>

    <a th:href="@{/grupo/{id}(id=${grupo.id})}">
        ←
    </a>

    <h1>Agregar gasto</h1>

</header>


<!-- Información del grupo -->

<section>

    <p>
        💰
        <strong th:text="${grupo.name}">
            Nombre del grupo
        </strong>
    </p>

</section>


<!-- Formulario -->

<main>

    <form
            th:action="@{/grupo/{id}/gasto(id=${grupo.id})}"
            method="post">


        <!-- DESCRIPCIÓN -->

        <section>

            <label for="descripcion">
                Descripción
            </label>

            <br>

            <input
                    type="text"
                    id="descripcion"
                    name="descripcion"
                    placeholder="Ej: Mercado, hospedaje..."
                    required>

        </section>


        <br>


        <!-- MONTO -->

        <section>

            <label for="monto">
                Monto
            </label>

            <br>

            <input
                    type="number"
                    id="monto"
                    name="monto"
                    placeholder="$ 0"
                    min="0"
                    step="0.01"
                    required>

        </section>


        <br>


        <!-- FECHA -->

        <section>

            <label for="fecha">
                Fecha
            </label>

            <br>

            <!-- CORREGIDO: el usuario NO debe poder tocar la fecha, ni siquiera
                 abriendo el calendario del navegador. Por eso son dos inputs:

                 1) Uno solo VISUAL, deshabilitado ("disabled"), que muestra la fecha
                    pero no se puede editar ni desde el calendario. Al estar "disabled",
                    el navegador NO lo envía al servidor (por eso no tiene name="fecha").

                 2) Uno oculto ("hidden"), invisible para el usuario, que sí tiene
                    name="fecha" y sí viaja al backend con el mismo valor. Este es
                    el que de verdad llega a tu @RequestParam LocalDate fecha. -->

            <input
                    type="date"
                    id="fecha"
                    th:value="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}"
                    disabled>

            <input
                    type="hidden"
                    name="fecha"
                    th:value="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">

        </section>


        <br>


        <!-- QUIÉN PAGÓ -->

        <section>

            <h2>
                ¿Quién pagó?
            </h2>

            <p>
                Selecciona una sola persona.
            </p>


            <!-- CORREGIDO: eran checkboxes con name="pagadores" (permitía varios).
                 Un gasto lo paga UNA sola persona, así que usamos radio buttons:
                 con el mismo "name" en todos, el navegador solo deja marcar uno.
                 También el name pasa a ser "pagadorId", para que coincida
                 exactamente con @RequestParam Long pagadorId del controlador. -->

            <div th:each="miembro : ${miembros}">

                <label>

                    <input
                            type="radio"
                            name="pagadorId"
                            th:value="${miembro.usuario.id}"
                            required>

                    <span th:text="${miembro.usuario.name}">
                            Nombre del usuario
                        </span>

                </label>

                <br>

            </div>

        </section>


        <br>


        <!-- DIVIDIR ENTRE -->

        <section>

            <h2>
                Dividir entre
            </h2>

            <p>
                Selecciona las personas que participarán en el gasto.
            </p>


            <div th:each="miembro : ${miembros}">

                <label>

                    <input
                            type="checkbox"
                            name="participantes"
                            th:value="${miembro.usuario.id}">

                    <span th:text="${miembro.usuario.name}">
                            Nombre del usuario
                        </span>

                </label>

                <br>

            </div>

        </section>


        <br>


        <!-- INFORMACIÓN -->

        <section>

            <p>
                💵
                Se dividirá en partes iguales entre las
                personas seleccionadas.
            </p>

        </section>


        <br>


        <!-- BOTÓN -->

        <button type="submit">
            Guardar gasto
        </button>


    </form>

</main>

</body>

</html>
