spring.datasource.url=jdbc:mysql://localhost:3306/gestor_gastos
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2 Client ID
google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
# Cookie de sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Activar SOLO cuando la app se sirva por HTTPS. En http:// el login dejaría de funcionar.
# server.servlet.session.cookie.secure=true

# Configuracion IA Groq Free (presupuesto $0 COP, deshabilitado por defecto sin API key)
nexus.ai.groq.enabled=${GROQ_ENABLED:false}
nexus.ai.groq.api-key=${GROQ_API_KEY:}
nexus.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
nexus.ai.resource.global-rpm=20
nexus.ai.resource.user-rpm=5
nexus.ai.resource.global-rpd=500
nexus.ai.resource.user-rpd=50
nexus.ai.resource.daily-token-budget=150000
nexus.ai.resource.tpm-limit=6000
nexus.ai.resource.reserve-percent=10
nexus.ai.resource.max-concurrent=2
nexus.ai.resource.circuit-failure-threshold=3
nexus.ai.resource.circuit-open-seconds=60

# Configuracion Telegram Bot API (presupuesto $0 COP, deshabilitado por defecto sin token)
nexus.telegram.enabled=${TELEGRAM_ENABLED:false}
nexus.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
nexus.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
nexus.telegram.poll-timeout=${TELEGRAM_POLL_TIMEOUT:25}
nexus.telegram.max-concurrent-updates=${TELEGRAM_MAX_CONCURRENT_UPDATES:2}
nexus.telegram.groups-enabled=${TELEGRAM_GROUPS_ENABLED:true}
