spring.datasource.url=jdbc:mysql://localhost:3306/gestor_gastos
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2 Client ID
google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
# Cookie de sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Activar SOLO cuando la app se sirva por HTTPS. En http:// el login dejaría de funcionar.
# server.servlet.session.cookie.secure=true
