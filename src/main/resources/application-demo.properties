# Perfil DEMO aislado para validacion MySQL 8 + Flyway + sustentacion NEXUS
# Requiere variables de entorno dedicadas; nunca usar la base habitual gestor_gastos ni usuario root.
spring.datasource.url=${NEXUS_DEMO_DB_URL:jdbc:mysql://localhost:3306/nexus_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${NEXUS_DEMO_DB_USERNAME:nexus_demo_user}
spring.datasource.password=${NEXUS_DEMO_DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Carga opcional e idempotente de datos sinteticos (requiere habilitacion explicita)
nexus.demo.seed-enabled=${NEXUS_DEMO_SEED_ENABLED:false}

# Integraciones externas controladas por entorno (desactivadas por defecto)
nexus.ai.groq.enabled=${GROQ_ENABLED:false}
nexus.ai.groq.api-key=${GROQ_API_KEY:}
nexus.telegram.enabled=${TELEGRAM_ENABLED:false}
nexus.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
nexus.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
nexus.telegram.groups-enabled=${TELEGRAM_GROUPS_ENABLED:false}
